name: Fast checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Focused tests / 집중 테스트
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Direct CLI evidence / CLI 직접 검증 증거
        if: ${{ always() }}
        run: python -m tools.pilot_checks --output "${{ runner.temp }}/pilot-evidence"
      - name: Preserve synthetic evidence / 합성 증거 보존
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pilot-evidence-python-${{ matrix.python }}
          path: ${{ runner.temp }}/pilot-evidence
          if-no-files-found: error
          retention-days: 7
  required:
    name: Required checks
    if: ${{ always() }}
    needs: [python]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require successful prerequisites / 선행 검사 성공 필수
        env:
          PREREQUISITE_RESULT: ${{ needs.python.result }}
        run: |
          if [ "$PREREQUISITE_RESULT" != success ]; then
            echo "Prerequisite failed, was cancelled or skipped. / 선행 검사가 실패·취소·생략되었습니다."
            exit 1
          fi
