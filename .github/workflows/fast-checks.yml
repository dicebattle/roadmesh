name: Fast checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies / 잠금 의존성 설치
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Focused tests / 집중 테스트
        run: npm test
      - name: Check current recording evidence / 현재 녹화 증거 검사
        run: npm run media:check
      - name: Direct CLI evidence / CLI 직접 검증 증거
        if: ${{ always() }}
        run: npm run pilot:checks -- --output "${{ runner.temp }}/pilot-evidence"
      - name: Preserve synthetic evidence / 합성 증거 보존
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pilot-evidence-node-${{ matrix.node }}
          path: ${{ runner.temp }}/pilot-evidence
          if-no-files-found: error
          retention-days: 7
  simulation:
    name: Implemented-module simulation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies / 잠금 의존성 설치
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile strict TypeScript / 엄격 TypeScript 컴파일
        run: npm run build
      - name: Cache pinned OSM source only / 고정 OSM 원본만 캐시
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/seoul-source-cache
          key: osm-source-282d012b7629c643695f286d4424d7f6d88548d99edb5577ca5b678906f13c17
      - name: Fresh real-engine simulation / 실제 엔진의 새 통합 시뮬레이션
        run: npm run simulation:check -- --output "${{ runner.temp }}/simulation-evidence"
      - name: Preserve compact integration evidence / 작은 통합 증거 보존
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: implemented-module-simulation
          path: |
            ${{ runner.temp }}/simulation-evidence/**/*.json
            ${{ runner.temp }}/simulation-evidence/**/*.txt
            ${{ runner.temp }}/simulation-evidence/**/*.sql
            ${{ runner.temp }}/simulation-evidence/**/*.md
            ${{ runner.temp }}/simulation-evidence/**/*.html
            ${{ runner.temp }}/simulation-evidence/**/context-edges.tsv
            ${{ runner.temp }}/simulation-evidence/traffic/**/traffic.tar
            ${{ runner.temp }}/simulation-evidence/traffic/public/*.jws.txt
            !${{ runner.temp }}/simulation-evidence/**/tiles/**
          if-no-files-found: error
          retention-days: 7
  required:
    name: Required checks
    if: ${{ always() }}
    needs: [node, simulation]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require successful prerequisites / 선행 검사 성공 필수
        env:
          NODE_RESULT: ${{ needs.node.result }}
          SIMULATION_RESULT: ${{ needs.simulation.result }}
        run: |
          if [ "$NODE_RESULT" != success ] || [ "$SIMULATION_RESULT" != success ]; then
            echo "Prerequisite failed, was cancelled or skipped. / 선행 검사가 실패·취소·생략되었습니다."
            exit 1
          fi
