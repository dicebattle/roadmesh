name: Fast checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies / 잠금 의존성 설치
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Focused tests / 집중 테스트
        run: npm test
      - name: Direct CLI evidence / CLI 직접 검증 증거
        if: ${{ always() }}
        run: npm run pilot:checks -- --output "${{ runner.temp }}/pilot-evidence"
      - name: Preserve synthetic evidence / 합성 증거 보존
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pilot-evidence-node-${{ matrix.node }}
          path: ${{ runner.temp }}/pilot-evidence
          if-no-files-found: error
          retention-days: 7
  required:
    name: Required checks
    if: ${{ always() }}
    needs: [node]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require successful prerequisites / 선행 검사 성공 필수
        env:
          PREREQUISITE_RESULT: ${{ needs.node.result }}
        run: |
          if [ "$PREREQUISITE_RESULT" != success ]; then
            echo "Prerequisite failed, was cancelled or skipped. / 선행 검사가 실패·취소·생략되었습니다."
            exit 1
          fi
