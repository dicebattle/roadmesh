<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>RouteLens · Simulation evidence / 시뮬레이션 증거</title
  ><style>
    :root {
      color-scheme: light;
      --paper: #f5f8fc;
      --ink: #172d46;
      --road: #9baec2;
      --truth: #1264b8;
      --observed: #d96b28;
      --success: #23775d;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font:
        15px/1.5 system-ui,
        sans-serif;
    }
    main {
      max-width: 1500px;
      margin: auto;
      padding: 32px;
    }
    header {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: start;
    }
    h1,
    h2 {
      font-family: "Avenir Next", "Trebuchet MS", sans-serif;
    }
    h1 {
      font-size: clamp(28px, 4vw, 46px);
      line-height: 1.15;
      margin: 4px 0 12px;
    }
    h2 {
      font-size: 21px;
      margin: 0 0 16px;
    }
    p {
      margin: 8px 0;
    }
    .eyebrow,
    code,
    output {
      font-family: ui-monospace, monospace;
    }
    .eyebrow {
      font-size: 12px;
      letter-spacing: 0.12em;
    }
    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 3fr) minmax(250px, 1fr);
      gap: 28px;
      margin-top: 28px;
    }
    .map {
      background: white;
      border: 1px solid #d7e0e9;
      border-radius: 14px;
      overflow: hidden;
    }
    svg {
      width: 100%;
      height: clamp(240px, calc(100vh - 430px), 480px);
      display: block;
    }
    svg text {
      font: 14px system-ui;
      fill: var(--ink);
    }
    .controls {
      padding: 18px;
      border-top: 1px solid #d7e0e9;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    button,
    select {
      font: inherit;
      color: inherit;
      background: white;
      border: 1px solid var(--road);
      border-radius: 6px;
      padding: 8px 12px;
      min-height: 42px;
    }
    button {
      cursor: pointer;
    }
    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    a:focus-visible {
      outline: 3px solid var(--truth);
      outline-offset: 3px;
    }
    input[type="range"] {
      flex: 1;
      min-width: 130px;
      accent-color: var(--truth);
    }
    label {
      display: inline-flex;
      gap: 6px;
      align-items: center;
    }
    a {
      color: var(--truth);
      overflow-wrap: anywhere;
    }
    .ledger {
      border-top: 3px solid var(--ink);
      padding-top: 18px;
    }
    .stage {
      padding: 13px 0;
      border-bottom: 1px solid #d7e0e9;
    }
    .status {
      color: var(--success);
      font-weight: 700;
    }
    .legend {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      padding: 14px 18px;
    }
    .truth {
      color: var(--truth);
    }
    .observed {
      color: var(--observed);
    }
    .provenance {
      font-size: 12px;
      overflow-wrap: anywhere;
      margin-top: 24px;
    }
    .checks {
      margin-top: 32px;
    }
    details {
      border-top: 1px solid var(--road);
      padding: 14px 0;
    }
    summary {
      cursor: pointer;
      font-weight: 600;
    }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 12px;
    }
    .notice {
      max-width: 80ch;
    }
    .timeline {
      display: block;
      width: 100%;
      font-size: 13px;
      padding: 0 18px 12px;
    }
    @media (max-width: 760px) {
      main {
        padding: 20px 14px;
      }
      .workspace {
        grid-template-columns: 1fr;
        gap: 24px;
      }
      header {
        flex-wrap: wrap;
      }
      .controls {
        gap: 10px;
      }
      svg {
        height: 340px;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      * {
        scroll-behavior: auto;
      }
    }
  </style>
  <main>
    <header>
      <div>
        <div class="eyebrow">ROUTELENS / P03</div>
        <h1

          data-ko="차량·GPS 시뮬레이션"

      </div>
      <button id="language" aria-label="Switch language / 언어 변경">

      <section>
        <div class="map">
          <svg

          <div class="legend">

              data-ko="● 정답 위치"

              data-ko="× GPS 관측"

          <div class="controls">
            <button id="play"></button

              </select></label
            ><label
              ><span data-en="Vehicle" data-ko="차량"></span
              ><select id="vehicle"></select></label
            ><label
              ><input id="all-roads" type="checkbox" /><span
                data-en="All fixture roads"
                data-ko="전체 시험도로"
              ></span></label
            ><label
              ><input id="truth" type="checkbox" checked /><span
                data-en="Truth"
                data-ko="정답"
              ></span></label
            ><label
              ><input id="observed" type="checkbox" checked /><span
                data-en="Observed"
                data-ko="관측"
              ></span
            ></label>
          </div>
        </div>
      </section>
      <aside class="ledger">
        <h2 data-en="Execution evidence" data-ko="실행 증거"></h2>
        <p id="result"></p>
        <div id="stages"></div>
        <div class="provenance" id="provenance"></div>
      </aside>
    </div>
    <section class="checks">
      <h2 data-en="Assertions and boundaries" data-ko="검사 결과와 한계"></h2>
      <div id="checks"></div>
      <ul id="limits"></ul>
    </section>

  <script>
    const data = JSON.parse(document.getElementById("report-data").textContent);

      if (text !== undefined) n.textContent = text;
      parent.append(n);
      return n;
    }
    function evidence(path, parent) {
      if (typeof path !== "string") return;
      const a = node("a", path, parent);
      if (
        !path.startsWith("/") &&
        !path.includes("\\") &&
        !path.split("/").includes("..") &&
        !/^[a-z][a-z0-9+.-]*:/i.test(path)
      )
        a.href = path;
      else a.removeAttribute("href");
    }

          s.status + " · " + (s.duration_ms / 1000).toFixed(2) + " s",
          e,
        );
        evidence(s.evidence_path, e);
      });
      $("provenance").replaceChildren();
      node(
        "p",
        (lang === "en" ? "Source: " : "소스: ") +
          data.source.commit +
          (data.source.dirty ? " (dirty / 미커밋 변경)" : ""),
        $("provenance"),
      );
      node("p", "Graph: " + data.graph_id, $("provenance"));
      node("p", data.generated_at_utc, $("provenance"));
      node("p", "SHA-256: " + data.implementation_sha256, $("provenance"));
      $("checks").replaceChildren();
      data.assertions.forEach((a) => {
        const e = node("details", undefined, $("checks"));
        node("summary", a.status + " · " + a["message_" + lang], e);
        node(
          "pre",
          JSON.stringify(
            {
              assertion_id: a.assertion_id,
              expected: a.expected,
              actual: a.actual,
            },
            null,
            2,
          ),
          e,
        );
        evidence(a.evidence_path, e);
      });
      $("limits").replaceChildren();
      data.limitations.forEach((l) =>
        node("li", l["message_" + lang], $("limits")),
      );
      const v = $("vehicle").options[0];
      if (v) v.textContent = lang === "en" ? "All vehicles" : "전체 차량";
      draw();
    }
    let viewportWidth = 900, viewportHeight = 560;
    function bounds() {
      const truth = data.vehicles.flatMap((v) =>
        v.truth.map((p) => [p.longitude, p.latitude]),
      );
      const coords =
        $("all-roads").checked || !truth.length
          ? data.roads.flatMap((r) => r.coordinates)
          : truth;
      const xs = coords.map((p) => p[0]),
        ys = coords.map((p) => p[1]);
      const minX = Math.min(...xs),
        maxX = Math.max(...xs),
        minY = Math.min(...ys),
        maxY = Math.max(...ys);
      return {
        minX,
        maxX,
        minY,
        maxY,
        scale: Math.min(
          Math.max(100, viewportWidth - 120) / (maxX - minX || 0.001),
          Math.max(100, viewportHeight - 110) / (maxY - minY || 0.001),
        ),
      };
    }
    let { minX, maxX, minY, maxY, scale } = bounds();
    function xy(p) {
      return [
        viewportWidth / 2 + (p[0] - (minX + maxX) / 2) * scale,
        viewportHeight / 2 - (p[1] - (minY + maxY) / 2) * scale,
      ];
    }
    function svg(tag, attrs) {
      const e = document.createElementNS(ns, tag);
      Object.entries(attrs).forEach(([k, v]) => e.setAttribute(k, String(v)));
      $("map").append(e);
      return e;
    }
    function point(p) {
      return xy([p.longitude, p.latitude]);
    }
    function draw() {
      viewportWidth = $("map").clientWidth || 900;
      viewportHeight = $("map").clientHeight || 560;
      $("map").setAttribute("viewBox", "0 0 " + viewportWidth + " " + viewportHeight);
      ({ minX, maxX, minY, maxY, scale } = bounds());
      $("map").replaceChildren();
      data.roads.forEach((r) => {
        svg("polyline", {
          points: r.coordinates.map((p) => xy(p).join(",")).join(" "),
          fill: "none",
          stroke: "#9BAEC2",
          "stroke-width": 12,
          "stroke-linecap": "round",
        });
        const first = r.coordinates[0];
        const last = r.coordinates[r.coordinates.length - 1];
        const p = xy([(first[0] + last[0]) / 2, (first[1] + last[1]) / 2]);
        const horizontal = Math.abs(last[0] - first[0]) >= Math.abs(last[1] - first[1]);
        const below = ["ab", "bc"].includes(r.label.toLowerCase());
        const t = svg("text", {
          x: p[0] + (horizontal ? 0 : 12),
          y: p[1] + (horizontal ? (below ? 24 : -14) : 4),
          "text-anchor": horizontal ? "middle" : "start",
        });
        t.textContent = r.label;
      });
      let omissions = 0;
      data.vehicles
        .filter(
          (v) =>
            $("vehicle").value === "*" || v.vehicle_id === $("vehicle").value,
        )
        .forEach((v, index) => {
          const truth = v.truth.filter((p) => p.offset_ms <= time),
            obs = v.observations.filter((p) => p.offset_ms <= time);
          if ($("truth").checked && truth.length) {
            svg("polyline", {
              points: truth.map((p) => point(p).join(",")).join(" "),
              fill: "none",
              stroke: "#1264B8",
              "stroke-width": 3,
            });
            const p = point(truth[truth.length - 1]);
            svg("circle", {
              cx: p[0],
              cy: p[1],
              r: 8,
              fill: "#1264B8",
              stroke: "white",
              "stroke-width": 2,
            });
            const rightHalf = p[0] > viewportWidth / 2;
            const lowerHalf = p[1] > viewportHeight / 2;
            const t = svg("text", {
              x: p[0] + (rightHalf ? -12 : 12),
              y: p[1] + (lowerHalf ? -20 - index * 20 : 22 + index * 20),
              "text-anchor": rightHalf ? "end" : "start",
            });
            t.textContent = v.vehicle_id;
          }
          if ($("observed").checked)
            obs.forEach((p) => {
              const q = point(p);
              svg("path", {
                d: "M" + (q[0] - 3) + "," + (q[1] - 3) + "l6,6m-6,0l6,-6",
                stroke: "#D96B28",
                "stroke-width": 2,
                opacity: 0.75,
              });
            });
          v.omissions
            .filter((p) => p.offset_ms <= time)
            .forEach((o) => {
              omissions++;
              const p = v.truth.find((t) => t.offset_ms === o.offset_ms);
              if (p && $("observed").checked) {
                const q = point(p);
                svg("circle", {
                  cx: q[0],
                  cy: q[1],
                  r: 6,
                  fill: "white",
                  stroke: "#172D46",
                  "stroke-width": 1.5,
                  "stroke-dasharray": "2 2",
                });
              }
            });
        });
      $("clock").textContent =
        (time / 1000).toFixed(1) +
        " / " +
        (data.summary.duration_ms / 1000).toFixed(1) +
        " s";
      $("omissions").textContent =
        (lang === "en"
          ? "Scheduled omissions so far: "
          : "현재까지 예정된 누락: ") + omissions;
      $("time").value = String(time);
    }
    $("time").max = String(data.summary.duration_ms);
    node("option", "All vehicles", $("vehicle")).value = "*";
    data.vehicles.forEach(
      (v) => (node("option", v.vehicle_id, $("vehicle")).value = v.vehicle_id),
    );
    $("language").onclick = () => {
      lang = lang === "en" ? "ko" : "en";
      translate();
    };
    $("play").onclick = () => {
      if (time >= data.summary.duration_ms) time = 0;
      playing = !playing;
      last = 0;
      translate();
      if (playing) requestAnimationFrame(tick);
    };
    $("time").oninput = () => {
      time = Number($("time").value);
      draw();
    };
    ["vehicle", "truth", "observed", "all-roads"].forEach(
      (id) => ($(id).onchange = draw),
    );
    function tick(now) {
      if (!playing) return;
      if (last)
        time = Math.min(
          data.summary.duration_ms,
          time + (now - last) * Number($("speed").value),
        );
      last = now;
      draw();
      if (time >= data.summary.duration_ms) {
        playing = false;
        translate();
      } else requestAnimationFrame(tick);
    }
    window.addEventListener("resize", draw);
    translate();
  </script>
</html>
